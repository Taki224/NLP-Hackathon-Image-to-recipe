name: CI

# Gate: app must boot and /retrieve must keep its contract before merging to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # ponytail: app/tests only need fastapi+pytest, not the torch/ML stack.
      # Install just those instead of `uv sync` (which would pull multi-GB torch).
      - run: uv venv
      - run: uv pip install fastapi uvicorn python-multipart pytest httpx
      - run: uv run pytest tests/ -q
